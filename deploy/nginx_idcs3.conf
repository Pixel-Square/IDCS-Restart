# nginx site configuration for IDCS 3.0
# Place this in /etc/nginx/sites-available/idcs3 and symlink to sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/idcs3 /etc/nginx/sites-enabled/idcs3

# ============================================================
# FRONTEND SITE: idcs3.krgi.co.in
# Serves React frontend (built) + API proxy to gunicorn3
# ============================================================

server {
    listen 80;
    server_name idcs3.krgi.co.in;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # NOTE: paths with spaces must be quoted
    root "/home/iqac/idcs 3.0/frontend/build";
    index index.html;

    client_max_body_size 50M;
    keepalive_timeout 65;
    send_timeout 300s;

    location ^~ /.well-known/acme-challenge/ {
        root "/home/iqac/idcs 3.0/frontend/build";
        default_type text/plain;
        try_files $uri =404;
    }

    location /static/ {
        alias "/home/iqac/idcs 3.0/backend/staticfiles/";
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /media/ {
        alias "/home/iqac/idcs 3.0/backend/media/";
        access_log off;
        expires 30d;
    }

    location /assets/ {
        alias "/home/iqac/idcs 3.0/frontend/build/assets/";
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /favicon.ico {
        alias "/home/iqac/idcs 3.0/frontend/build/favicon.png";
        access_log off;
        expires 30d;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
        proxy_request_buffering on;
        proxy_pass http://unix:/run/gunicorn3/gunicorn3.sock;
    }

    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://unix:/run/gunicorn3/gunicorn3.sock;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}


