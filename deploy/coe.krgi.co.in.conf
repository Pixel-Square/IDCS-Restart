# Nginx site configuration for the COE frontend on coe.krgi.co.in
# Migrated to IDCS-MAIN backend: 2026-10-15
# Proxies /api/ to gunicorn-idcs (unix:/run/gunicorn-idcs/idcs.sock)

server {
    listen 80;
    server_name coe.krgi.co.in;

    # Cloudflare Tunnel forwards this hostname to local HTTP/80.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Cloudflare real-IP headers
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.159.0.0/16;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    root /home/iqac/IDCS-MAIN/coe/dist;
    index index.html;

    client_max_body_size 50M;
    keepalive_timeout 65;
    send_timeout 300s;

    location ^~ /.well-known/acme-challenge/ {
        root /home/iqac/IDCS-MAIN/coe/dist;
        default_type text/plain;
        try_files $uri =404;
    }

    location /assets/ {
        alias /home/iqac/IDCS-MAIN/coe/dist/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /favicon.ico {
        alias /home/iqac/IDCS-MAIN/coe/dist/favicon.png;
        access_log off;
        expires 30d;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
        proxy_request_buffering on;
        proxy_pass http://unix:/run/gunicorn-idcs/idcs.sock;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# HTTPS block removed — Cloudflare Tunnel terminates TLS upstream.
