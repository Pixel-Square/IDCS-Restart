# Nginx configuration for IDCS Frontend at idcs5.krgi.co.in
# Place this in /etc/nginx/sites-available/idcs5.krgi.co.in
# Enable with: sudo ln -s /etc/nginx/sites-available/idcs5.krgi.co.in /etc/nginx/sites-enabled/idcs5.krgi.co.in

server {
    listen 80;
    server_name idcs5.krgi.co.in;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /home/iqac2/Desktop/idcs-mt/frontend/build;
    index index.html;

    client_max_body_size 50M;
    keepalive_timeout 65;
    send_timeout 300s;

    # Trust Cloudflare IP ranges for correct client IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.159.0.0/16;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    location ^~ /.well-known/acme-challenge/ {
        root /home/iqac2/Desktop/idcs-mt/frontend/build;
        default_type text/plain;
        try_files $uri =404;
    }

    # Frontend static assets
    location /assets/ {
        alias /home/iqac2/Desktop/idcs-mt/frontend/build/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /favicon.ico {
        alias /home/iqac2/Desktop/idcs-mt/frontend/build/favicon.png;
        access_log off;
        expires 30d;
    }

    # Backend static files
    location /static/ {
        alias /home/iqac2/Desktop/idcs-mt/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Backend media files
    location /media/ {
        alias /home/iqac2/Desktop/idcs-mt/backend/media/;
        access_log off;
        expires 30d;
    }

    # API proxy to backend
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
        proxy_request_buffering on;
        proxy_pass http://unix:/run/gunicorn-idcs5/idcs5.sock;
    }

    # Admin panel
    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://unix:/run/gunicorn-idcs5/idcs5.sock;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
